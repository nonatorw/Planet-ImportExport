# File Import and Export Service
# See docs/adr/ADR-0001 (storage) and docs/adr/ADR-0006 (authentication) for the rationale behind
# the MongoDB and OIDC configuration below.

# --- MongoDB (ADR-0001) ---------------------------------------------------
# Storage is embedded in-memory MongoDB via Flapdoodle, not a containerized Dev Services instance.
# Quarkus MongoDB Dev Services is disabled everywhere; the Flapdoodle-backed connection string is
# supplied instead (at %dev/%test runtime via a startup hook / QuarkusTestResourceLifecycleManager,
# both implementation detail for Group A1-A4, not this scaffolding group).
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.database=importexport

# --- OIDC / Keycloak Dev Services (ADR-0006) ------------------------------
# quarkus-oidc is configured as a resource server. Quarkus Dev Services for Keycloak auto-provisions
# a Keycloak container plus a preconfigured realm/client for quarkusDev and @QuarkusTest runs, so no
# auth-server-url/client-id/client-secret is hardcoded here for %dev/%test.
# Every /api/v1/** resource class is @Authenticated (Group E, tasks E1-E3): ImportResource,
# ExportResource, and JobConfigurationResource all require a valid OIDC bearer token.
quarkus.oidc.tenant-enabled=true
%dev.quarkus.keycloak.devservices.enabled=true
%test.quarkus.keycloak.devservices.enabled=true

# E2/E3 (confirmed empirically against Quarkus 3.39.3's Dev-Services-provisioned realm — see
# AuthenticationIT and its Javadoc for the full investigation): no explicit realm-name/client-id/
# client-secret override is configured here. Quarkus Dev Services for Keycloak (this extension
# version) auto-generates a realm named "quarkus" with a client "quarkus-app" (secret "secret")
# that already has serviceAccountsEnabled=true and directAccessGrantsEnabled=true, i.e. the
# client_credentials grant works out of the box with no configuration changes needed here.
# That same auto-generated client's defaultClientScopes are only ["microprofile-jwt", "basic"] —
# no "offline_access" — so Keycloak does NOT issue a refresh_token for this grant by default, and
# there is no quarkus.keycloak.devservices.* property (as of 3.39.3) to add a client default scope
# to the auto-generated client without replacing the whole realm via realm-path. This is expected,
# spec-conformant behavior per OAuth2 RFC 6749 (Client Credentials has no session to refresh); see
# AuthenticationIT#tokenResponse_refreshTokenFieldObservation for the concrete recommendation to
# apply on a real (non-Dev-Services) Keycloak realm if a refresh token is genuinely required there.

# Production must not rely on Dev Services; explicit values are required before a prod deployment.
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}
