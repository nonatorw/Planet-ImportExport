# File Import and Export Service
# See docs/adr/ADR-0001 (storage) and docs/adr/ADR-0006 (authentication) for the rationale behind
# the MongoDB and OIDC configuration below.

# --- MongoDB (ADR-0001) ---------------------------------------------------
# Storage is embedded in-memory MongoDB via Flapdoodle, not a containerized Dev Services instance.
# Quarkus MongoDB Dev Services is disabled everywhere; the Flapdoodle-backed connection string is
# supplied instead (at %dev/%test runtime via a startup hook / QuarkusTestResourceLifecycleManager,
# both implementation detail for Group A1-A4, not this scaffolding group).
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.database=importexport

# --- OIDC / Keycloak Dev Services (ADR-0006) ------------------------------
# quarkus-oidc is configured as a resource server. Quarkus Dev Services for Keycloak auto-provisions
# a Keycloak container plus a preconfigured realm/client for quarkusDev and @QuarkusTest runs, so no
# auth-server-url/client-id/client-secret is hardcoded here for %dev/%test.
# No endpoint is protected yet (Group E); this only establishes the extension + Dev Services wiring.
quarkus.oidc.tenant-enabled=true
%dev.quarkus.keycloak.devservices.enabled=true
%test.quarkus.keycloak.devservices.enabled=true

# Production must not rely on Dev Services; explicit values are required before a prod deployment.
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}
